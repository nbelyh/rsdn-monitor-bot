name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        run: python -m compileall -q .

      # Only tracked files; App Service runs the Oryx build (SCM_DO_BUILD_DURING_DEPLOYMENT=true)
      - name: Package
        run: git archive --format=zip -o app.zip HEAD

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: rsdnbot-monitor
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
